name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # paper-api 26.3 is published as Java 25 bytecode, so the compiler itself must
      # be 25+ even though the plugin output still targets Java 21 (maven.compiler.release).
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: mvn -B clean package

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: Cosmos-jar
          path: target/Cosmos-*.jar
          if-no-files-found: error
